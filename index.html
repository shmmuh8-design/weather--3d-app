const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const angleDiff = (a, b) => {
  let d = ((a - b + 180) % 360 + 360) % 360 - 180;
  return Math.abs(d);
};

const DIRS = [
  "شمال", "شمال شرق", "شرق", "جنوب شرق",
  "جنوب", "جنوب غرب", "غرب", "شمال غرب",
];
const dirLabel = (deg) => DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

  const fillHeight = 8 + pct * 74;
  return (
    <div style={{ position: "relative", width: 92, height: 168 }}>
      <svg width="92" height="168" viewBox="0 0 92 168">
        <defs>
          <radialGradient id="bulbGlass" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stopColor="#3a5468" />
            <stop offset="55%" stopColor="#1c2e3d" />
            <stop offset="100%" stopColor="#0d1822" />
          </radialGradient>
          <linearGradient id="tubeGlass" x1="0" x2="1">
            <stop offset="0%" stopColor="#0d1822" />
            <stop offset="35%" stopColor="#33495c" />
            <stop offset="55%" stopColor="#1c2e3d" />
            <stop offset="100%" stopColor="#0a141d" />
          </linearGradient>
          <linearGradient id="mercury" x1="0" x2="0" y1="1" y2="0">

            <stop offset="100%" stopColor="#FFB37B" />

          <radialGradient id="bulbMercury" cx="35%" cy="30%" r="75%">

        {/* tube */}

        {/* mercury fill */}

        {/* bulb */}

        <ellipse cx="39" cy="132" rx="4" ry="7" fill="#ffffff" opacity="0.35" />
        {/* tick marks */}

}

  const ticks = Array.from({ length: 16 }, (_, i) => i * 22.5);
  return (
    <div style={{ position: "relative", width: 220, height: 220 }}>
      <svg width="220" height="220" viewBox="0 0 220 220">

          <linearGradient id="needleN" x1="0" y1="0" x2="0" y2="1">

        {/* cardinal letters */}
        {[
          ["ش", 110, 40],
          ["ج", 110, 190],

          <polygon points="110,186 121,110 110,120 99,110" fill="url(#needleS)" />
        </g>
        {/* center cap — 3D dome */}
        <circle cx="110" cy="110" r="13" fill="#1B3350" />
        <circle cx="110" cy="110" r="9" fill="#3C5B72" />
        <ellipse cx="107" cy="107" rx="3" ry="4" fill="#ffffff" opacity="0.5" />
      </svg>

const ALERT_STYLES = {
  wind: { title: "تغيّر مفاجئ في اتجاه الرياح", color: "#FF5470", glow: "rgba(255,84,112,0.25)" },
  speed: { title: "تغيّر مفاجئ في سرعة الرياح", color: "#C4A7FF", glow: "rgba(196,167,255,0.28)" },
  humidity: { title: "تغيّر ملحوظ في الرطوبة", color: "#45D6C4", glow: "rgba(69,214,196,0.28)" },
};

function AlertToast({ item, onDismiss }) {
  const s = ALERT_STYLES[item.kind] || ALERT_STYLES.wind;
  return (
    <div
      style={{
        display: "flex",
        alignItems: "center",
        gap: 12,
        background: "linear-gradient(135deg, #1B1A24, #12121A)",
        border: `1px solid ${s.color}`,
        boxShadow: `0 8px 24px ${s.glow}, inset 0 1px 0 rgba(255,255,255,0.05)`,
        borderRadius: 16,
        padding: "12px 14px",
        animation: "slideDown .45s cubic-bezier(.2,1.4,.4,1)",
      }}
    >
      <div
        style={{
          width: 36, height: 36, borderRadius: "50%", flexShrink: 0,
          background: `radial-gradient(circle at 35% 30%, ${s.color}, ${s.color}CC 60%, #1A1420)`,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: `0 3px 8px ${s.glow}`,
        }}
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 3v10M12 18v.01" stroke="#1A1420" strokeWidth="2.5" strokeLinecap="round" />
        </svg>
      </div>
      <div style={{ flex: 1, textAlign: "right" }}>

        </div>

        </div>
      </div>
      <button
        onClick={onDismiss}
        style={{
          background: "transparent", border: "none", color: "#A8A2B4",
          fontSize: 16, cursor: "pointer", padding: 4, lineHeight: 1,
        }}
        aria-label="إغلاق"
      >×</button>
    </div>
  );
}

function WeatherApp3D() {
  const [cityIndex, setCityIndex] = useState(0);
  const [clockText, setClockText] = useState("");
  const city = CITIES[cityIndex];

  useEffect(() => {
    const fmt = () => {
      setClockText(
        new Intl.DateTimeFormat("ar", {
          timeZone: city.tz,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        }).format(new Date())
      );
    };
    fmt();
    const t = setInterval(fmt, 1000);
    return () => clearInterval(t);
  }, [city.tz]);

  const [temp, setTemp] = useState(27);
  const [indoorTemp, setIndoorTemp] = useState(23);
  const [humidity, setHumidity] = useState(52);
  const [speed, setSpeed] = useState(14);
  const [direction, setDirection] = useState(120);
  const [flash, setFlash] = useState(false);
  const [humidityPulse, setHumidityPulse] = useState(false);
  const [speedPulse, setSpeedPulse] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [log, setLog] = useState([
    { id: 0, kind: "wind", time: "٠٩:١٤", text: "استقرار عام في الاتجاه حول الشرق" },
  ]);
  const [notifOn, setNotifOn] = useState(true);
  const [pushStatus, setPushStatus] = useState("idle"); // idle | subscribed | denied | unsupported
  const prevDir = useRef(120);
  const prevHumidity = useRef(52);
  const prevSpeed = useRef(14);
  const idCounter = useRef(1);

  const pushAlert = useCallback((kind, text) => {
    const id = idCounter.current++;
    setToasts((t) => [...t, { id, kind, text }]);
    setLog((l) => [
      { id, kind, time: new Date().toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" }), text },
      ...l,
    ].slice(0, 6));
    if (kind === "wind") {
      setFlash(true);
      setTimeout(() => setFlash(false), 1600);
    } else if (kind === "humidity") {
      setHumidityPulse(true);
      setTimeout(() => setHumidityPulse(false), 1600);
    } else if (kind === "speed") {
      setSpeedPulse(true);
      setTimeout(() => setSpeedPulse(false), 1600);
    }
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200);
  }, []);

  const sendSubscriptionToServer = useCallback(async (subscription, cityName) => {
    try {
      await fetch("/api/subscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subscription, city: cityName }),
      });
    } catch (err) {}
  }, []);

  const enableRealNotifications = useCallback(async () => {
    if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      setPushStatus("unsupported");
      return;
    }
    try {
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        setPushStatus("denied");
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      let subscription = await reg.pushManager.getSubscription();
      if (!subscription) {
        subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      await sendSubscriptionToServer(subscription, city.name);
      setPushStatus("subscribed");
    } catch (err) {
      setPushStatus("denied");
    }
  }, [city, sendSubscriptionToServer]);

  // تحقّق عند التحميل إن كان هناك اشتراك فعّال مسبقًا
  useEffect(() => {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      setPushStatus("unsupported");
      return;
    }
    navigator.serviceWorker.ready.then(async (reg) => {
      const subscription = await reg.pushManager.getSubscription();
      if (subscription && Notification.permission === "granted") {
        setPushStatus("subscribed");
      }
    }).catch(() => {});
  }, []);

  // عند تغيير المدينة وكانت الإشعارات الحقيقية مفعّلة، حدّث المدينة المشترك بها في السيرفر
  useEffect(() => {
    if (pushStatus !== "subscribed") return;
    navigator.serviceWorker.ready.then(async (reg) => {
      const subscription = await reg.pushManager.getSubscription();
      if (subscription) sendSubscriptionToServer(subscription, city.name);
    });
  }, [city, pushStatus, sendSubscriptionToServer]);

  const [loading, setLoading] = useState(true);
  const [apiError, setApiError] = useState(false);
  const [lastUpdated, setLastUpdated] = useState(null);
  const isFirstFetch = useRef(true);

  const fetchWeather = useCallback(async (c) => {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m&timezone=auto`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("bad response");
      const data = await res.json();
      const cur = data.current;
      if (!cur) throw new Error("no current data");

      setTemp(cur.temperature_2m);
      setHumidity(cur.relative_humidity_2m);
      setSpeed(cur.wind_speed_10m);
      setDirection(cur.wind_direction_10m);
      setApiError(false);
      setLastUpdated(new Date());

      if (isFirstFetch.current) {
        prevHumidity.current = cur.relative_humidity_2m;
        prevSpeed.current = cur.wind_speed_10m;
        prevDir.current = cur.wind_direction_10m;
        isFirstFetch.current = false;
      } else if (notifOn) {
        if (Math.abs(cur.relative_humidity_2m - prevHumidity.current) > 9) {
          pushAlert("humidity", `الرطوبة الآن ${Math.round(cur.relative_humidity_2m)}٪ بعد أن كانت ${Math.round(prevHumidity.current)}٪`);
          prevHumidity.current = cur.relative_humidity_2m;
        }
        if (Math.abs(cur.wind_speed_10m - prevSpeed.current) > 8) {
          pushAlert("speed", `سرعة الرياح الآن ${Math.round(cur.wind_speed_10m)} كم/س بعد أن كانت ${Math.round(prevSpeed.current)} كم/س`);
          prevSpeed.current = cur.wind_speed_10m;
        }
        if (angleDiff(cur.wind_direction_10m, prevDir.current) > 40) {
          pushAlert("wind", `تحوّل من ${dirLabel(prevDir.current)} إلى ${dirLabel(cur.wind_direction_10m)} (${Math.round(cur.wind_direction_10m)}°)`);
          prevDir.current = cur.wind_direction_10m;
        }
      }
    } catch (e) {
      setApiError(true);
    } finally {
      setLoading(false);
    }
  }, [notifOn, pushAlert]);

  useEffect(() => {
    setLoading(true);
    isFirstFetch.current = true;
    fetchWeather(city);
    const interval = setInterval(() => fetchWeather(city), 60000);
    return () => clearInterval(interval);
  }, [city, fetchWeather]);

  // درجة حرارة داخل المكان تقديرية محليًا — لا يوجد مستشعر داخلي حقيقي متصل بعد
  useEffect(() => {
    const interval = setInterval(() => {
      setIndoorTemp((v) => clamp(v + (Math.random() - 0.5) * 0.25, 20, 27));
    }, 3200);
    return () => clearInterval(interval);
  }, []);

  return (
    <div
      style={{
        fontFamily: "Inter, sans-serif",
        direction: "rtl",
        minHeight: "100vh",
        background: "radial-gradient(120% 100% at 50% 0%, #16283A 0%, #0A1420 55%, #060D15 100%)",
        display: "flex",
        justifyContent: "center",
        padding: "18px 10px",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');
        @keyframes slideDown { from { opacity:0; transform: translateY(-16px) scale(.96);} to {opacity:1; transform: translateY(0) scale(1);} }
        @keyframes pulseGlow { 0%,100% { filter: drop-shadow(0 0 0px rgba(183,156,255,0)); } 50% { filter: drop-shadow(0 0 14px rgba(183,156,255,0.55)); } }
        .num { font-family: 'Space Grotesk', sans-serif; }
      `}</style>

      <div
        style={{
          width: "100%",
          maxWidth: 380,
          background: "linear-gradient(180deg, #0D1B28 0%, #0A1420 100%)",
          borderRadius: 34,
          border: "1px solid #1C3348",
          boxShadow: "0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)",
          padding: "20px 18px 26px",
          position: "relative",
          overflow: "hidden",
        }}
      >
        {/* توهج خلفي زخرفي */}
        <div style={{
          position: "absolute", top: -80, right: -60, width: 240, height: 240,
          background: "radial-gradient(circle, rgba(255,138,91,0.14), transparent 70%)",
          pointerEvents: "none",
        }} />

        {/* الرأس */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <div>
            <div style={{ fontSize: 12, color: "#7B93A8", fontWeight: 600 }}>محطة الرصد</div>
            <div style={{ fontSize: 17, color: "#EAF2F8", fontWeight: 700, marginTop: 2 }}>
              مدينة {city.name}
            </div>
            <div className="num" style={{ fontSize: 12.5, color: "#5C7488", marginTop: 2, letterSpacing: 0.5 }}>
              {clockText}
            </div>
          </div>
          <button
            onClick={() => setNotifOn((v) => !v)}
            style={{
              display: "flex", alignItems: "center", gap: 6,
              background: notifOn ? "linear-gradient(135deg,#2A4A56,#12262C)" : "#16232C",
              border: `1px solid ${notifOn ? "#45D6C4" : "#2A3A46"}`,
              borderRadius: 20, padding: "7px 12px", cursor: "pointer",
            }}
          >
            <span style={{
              width: 8, height: 8, borderRadius: "50%",
              background: notifOn ? "#45D6C4" : "#4A5A66",
              boxShadow: notifOn ? "0 0 8px #45D6C4" : "none",
            }} />
            <span style={{ fontSize: 11.5, color: notifOn ? "#B7EFE6" : "#7B93A8", fontWeight: 600 }}>
              {notifOn ? "التنبيهات مفعّلة" : "التنبيهات متوقفة"}
            </span>
          </button>
        </div>

        {/* إشعارات النظام الحقيقية عبر تطبيق ntfy (تصل حتى مع إغلاق التطبيق) */}
        <div style={{
          marginBottom: 10, background: "#0F2A28", border: "1px solid #1F5A50",
          borderRadius: 14, padding: "10px 12px", fontSize: 11.5, color: "#B7EFE6", lineHeight: 1.7,
        }}>
          🔔 للحصول على إشعارات حقيقية تصل حتى لو كان التطبيق مغلقًا:
          <br />١) ثبّت تطبيق <b>ntfy</b> على هاتفك
          <br />٢) اشترك في الموضوع: <span className="num" style={{ color: "#7CF2DE" }}>weather-salem-ddf80910</span>
        </div>

        {/* شريط اختيار المدينة */}
        <div style={{
          display: "flex", gap: 7, overflowX: "auto", padding: "10px 0 4px",
          marginBottom: 2,
        }}>
          {CITIES.map((c, i) => (
            <button
              key={c.name}
              onClick={() => setCityIndex(i)}
              style={{
                flexShrink: 0,
                background: i === cityIndex ? "linear-gradient(135deg,#2E4E63,#173040)" : "#111F29",
                border: `1px solid ${i === cityIndex ? "#4FA8C9" : "#1E323F"}`,
                color: i === cityIndex ? "#DFF3FB" : "#7B93A8",
                borderRadius: 16, padding: "6px 13px", fontSize: 12,
                fontWeight: 600, cursor: "pointer", fontFamily: "Inter, sans-serif",
              }}
            >
              {c.name}
            </button>
          ))}
        </div>

        <div style={{
          display: "flex", alignItems: "center", gap: 6, marginBottom: 4, padding: "0 2px",
        }}>
          <span style={{
            width: 6, height: 6, borderRadius: "50%",
            background: apiError ? "#FF5470" : loading ? "#7B93A8" : "#45D6C4",
          }} />
          <span style={{ fontSize: 11, color: "#7B93A8", fontFamily: "Inter, sans-serif" }}>
            {apiError
              ? "تعذّر تحديث البيانات الحية — سيُعاد المحاولة تلقائيًا"
              : loading
                ? "جارٍ جلب بيانات حية..."
                : `بيانات حية من Open-Meteo · آخر تحديث ${lastUpdated ? lastUpdated.toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" }) : ""}`}
          </span>
        </div>

        {/* شريط الإشعارات المنبثقة */}
        <div style={{ display: "flex", flexDirection: "column", gap: 8, margin: "10px 0", minHeight: toasts.length ? 8 : 0 }}>
          {toasts.map((t) => (
            <AlertToast key={t.id} item={t} onDismiss={() => setToasts((arr) => arr.filter((x) => x.id !== t.id))} />
          ))}
        </div>

        {/* البطاقة الرئيسية — الحرارة */}
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          background: "linear-gradient(135deg, #17293A, #0F1E2A)",
          border: "1px solid #22384A", borderRadius: 24, padding: "18px 20px", marginTop: 4,
        }}>
          <div>
            <div style={{ fontSize: 12, color: "#7B93A8", fontWeight: 600, marginBottom: 6 }}>درجة الحرارة بالخارج</div>
            <div className="num" style={{ fontSize: 46, color: "#FFB37B", fontWeight: 700, lineHeight: 1 }}>
              {Math.round(temp)}°
            </div>
            <div style={{ fontSize: 12.5, color: "#8CA3BF", marginTop: 6 }}>
              أعلى {Math.round(temp + 4)}° · أدنى {Math.round(temp - 6)}°
            </div>
          </div>
          <ThermoGauge value={temp} />
        </div>

        {/* صف الرطوبة وسرعة الرياح ودرجة الحرارة الداخلية */}
        <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
          <div style={{
            flex: 1, background: "linear-gradient(135deg, #14262C, #0E1B1E)",
            border: `1px solid ${humidityPulse ? "#45D6C4" : "#1F3A3D"}`, borderRadius: 20, padding: "12px 8px",
            boxShadow: humidityPulse ? "0 0 16px rgba(69,214,196,0.45)" : "none",
            transition: "box-shadow .3s, border-color .3s",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 6,
          }}>
            <HumidityDrop value={humidity} />
            <div className="num" style={{ fontSize: 20, color: "#7CF2DE", fontWeight: 700 }}>{Math.round(humidity)}٪</div>
            <div style={{ fontSize: 10.5, color: "#7B93A8", fontWeight: 600, textAlign: "center" }}>الرطوبة</div>
          </div>

          <div style={{
            flex: 1, background: "linear-gradient(135deg, #1D1A2C, #14121E)",
            border: `1px solid ${speedPulse ? "#C4A7FF" : "#2E2A46"}`, borderRadius: 20, padding: "12px 8px",
            boxShadow: speedPulse ? "0 0 16px rgba(196,167,255,0.45)" : "none",
            transition: "box-shadow .3s, border-color .3s",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6,
          }}>
            <svg width="52" height="52" viewBox="0 0 60 60" style={{ animation: "pulseGlow 3s ease-in-out infinite" }}>
              <defs>
                <linearGradient id="fanBlade" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stopColor="#D8C6FF" />
                  <stop offset="100%" stopColor="#8B6FE0" />
                </linearGradient>
              </defs>
              <g style={{
                transformOrigin: "30px 30px",
                animation: `spin ${Math.max(0.4, 3 - speed / 16)}s linear infinite`,
              }}>
                {[0, 120, 240].map((a) => (
                  <ellipse key={a} cx="30" cy="16" rx="7" ry="14" fill="url(#fanBlade)"
                    transform={`rotate(${a} 30 30)`} opacity="0.9" />
                ))}
              </g>
              <circle cx="30" cy="30" r="6" fill="#3C2E63" />
              <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
            </svg>
            <div className="num" style={{ fontSize: 20, color: "#C4A7FF", fontWeight: 700 }}>{Math.round(speed)}</div>
            <div style={{ fontSize: 10.5, color: "#7B93A8", fontWeight: 600, textAlign: "center" }}>كم/س رياح</div>
          </div>

          <div style={{
            flex: 1, background: "linear-gradient(135deg, #16262F, #0E1B22)",
            border: "1px solid #234254", borderRadius: 20, padding: "12px 8px",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6,
          }}>
            <IndoorGauge value={indoorTemp} />
            <div className="num" style={{ fontSize: 20, color: "#7FD6FF", fontWeight: 700 }}>{Math.round(indoorTemp)}°</div>
            <div style={{ fontSize: 10.5, color: "#7B93A8", fontWeight: 600, textAlign: "center" }}>داخل المكان (تقديري)</div>
          </div>
        </div>

        {/* بوصلة اتجاه الرياح */}
        <div style={{
          marginTop: 14, background: "linear-gradient(135deg, #12212F, #0C1720)",
          border: "1px solid #1C3348", borderRadius: 24, padding: "18px 10px 14px",
          display: "flex", flexDirection: "column", alignItems: "center",
        }}>
          <div style={{ fontSize: 12, color: "#7B93A8", fontWeight: 600, marginBottom: 8, alignSelf: "flex-end", marginInlineEnd: 10 }}>
            اتجاه الرياح
          </div>
          <WindCompass direction={direction} speed={speed} flash={flash} />
          <div className="num" style={{ fontSize: 15, color: "#EAF2F8", fontWeight: 700, marginTop: 6 }}>
            {dirLabel(direction)} · {Math.round(direction)}°
          </div>
        </div>

        {/* سجل التنبيهات */}
        <div style={{ marginTop: 14 }}>
          <div style={{ fontSize: 12, color: "#7B93A8", fontWeight: 600, marginBottom: 8 }}>سجل التنبيهات الأخيرة</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {log.map((item) => (
              <div key={item.id} style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                background: "#101F2B", border: "1px solid #1B3040", borderRadius: 14,
                padding: "9px 12px", gap: 8,
              }}>
                <span style={{
                  width: 7, height: 7, borderRadius: "50%", flexShrink: 0,
                  background: (ALERT_STYLES[item.kind] || ALERT_STYLES.wind).color,
                }} />
                <span style={{ fontSize: 12.5, color: "#C7D6E2", flex: 1 }}>{item.text}</span>
                <span className="num" style={{ fontSize: 11.5, color: "#5C7488" }}>{item.time}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<WeatherApp3D />);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
