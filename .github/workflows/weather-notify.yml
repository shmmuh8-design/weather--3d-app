name: Weather Notify

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: فحص الطقس وإرسال إشعار عند الحاجة
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          CITY_LAT: ${{ vars.CITY_LAT }}
          CITY_LON: ${{ vars.CITY_LON }}
        run: node scripts/check-weather.mjs

      - name: حفظ آخر حالة للطقس في المستودع
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@github.com"
          git add weather-state.json
          git diff --staged --quiet || git commit -m "تحديث حالة الطقس"
          git push
